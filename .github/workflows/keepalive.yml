name: Keep bot awake

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Ping bot API in a continuous loop
        run: |
          for i in $(seq 1 100); do
            curl -fsS -m 60 https://m-n-m-s-bot.onrender.com || true
            sleep 180
          done
